<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" role="img" aria-label="Electrometer concept: the chamber, detector board and electrometer sit in a grounded tin; one probe cable is moved by hand between the per-channel switch connectors; range elements stay at the summing node in the head; HV supply and radio antenna are outside the tin">
<title>Electrometer concept: the chamber, detector board and electrometer sit in a grounded tin; one probe cable is moved by hand between the per-channel switch connectors; range elements stay at the summing node in the head; HV supply and radio antenna are outside the tin</title>

<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --box:#ffffff; --edge:#898781;
        --group:#f3f2ee; --sig:#2a78d6; --ctl:#d95926; --man:#1a8f5a; --hv:#c62828; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --box:#262624; --edge:#6f6e69;
          --group:#222220; --sig:#3987e5; --ctl:#ec835a; --man:#52c48a; --hv:#ef6b6b; }
  }
  .bg { fill:var(--bg); }
  .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
  .group { fill:var(--group); stroke:var(--edge); stroke-width:1; }
  .encl { fill:none; stroke:var(--edge); stroke-width:1.4; stroke-dasharray:7 4; }
  .hvbox { fill:var(--box); stroke:var(--hv); stroke-width:1.4; }
  .t { fill:var(--ink); font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { fill:var(--ink2); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .k { fill:var(--ink); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .g { fill:var(--ink2); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.02em; }
  .lsig { fill:var(--sig); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lctl { fill:var(--ctl); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lman { fill:var(--man); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lhv { fill:var(--hv); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wire { fill:none; stroke:var(--ink); stroke-width:1.3; }
  .sig { fill:none; stroke:var(--sig); stroke-width:2.2; stroke-linejoin:round; }
  .ctl { fill:none; stroke:var(--ctl); stroke-width:1.6; stroke-dasharray:6 4; stroke-linejoin:round; }
  .man { fill:none; stroke:var(--man); stroke-width:3; stroke-linejoin:round; }
  .gang { fill:none; stroke:var(--man); stroke-width:1.6; stroke-dasharray:3 3; stroke-linejoin:round; }
  .hv { fill:none; stroke:var(--hv); stroke-width:2.5; stroke-linejoin:round; }
  .gnd { fill:none; stroke:var(--ink2); stroke-width:1.5; }
  .lever-man { stroke:var(--man); stroke-width:2.2; }
  .lever-ctl { stroke:var(--ctl); stroke-width:2.2; }
  .term { fill:var(--box); stroke:var(--ink); stroke-width:1.3; }
  .jack { fill:var(--box); stroke:var(--ink); stroke-width:1.5; }
  .part { fill:var(--box); stroke:var(--ink); stroke-width:1.3; }
  .plate { stroke:var(--ink); stroke-width:2.2; }
  .node { fill:var(--ink); }
  .cap0 { fill:var(--man); }
  .hsig { fill:var(--sig); } .hctl { fill:var(--ctl); } .hman { fill:var(--man); }
  .dot { fill:var(--ctl); stroke:var(--box); stroke-width:1.5; }
</style>
<defs>
  <marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hsig" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="actl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hctl" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aman" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hman" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1200" height="940" rx="10"/>
<g transform="translate(0,70)">
<rect class="encl" x="8" y="-28" width="1184" height="588" rx="12"/>
<text class="g" x="24" y="-10" text-anchor="start">COOKIE TIN: GROUNDED, LIGHT-TIGHT. TIN, COAX SHIELDS AND ELECTROMETER COMMON BONDED TO THE DETECTOR BOARD 0 V AT ONE POINT</text>
<rect class="group" x="20" y="20" width="330" height="520" rx="10"/>
<rect class="group" x="375" y="20" width="470" height="370" rx="10"/>
<rect class="group" x="870" y="20" width="310" height="370" rx="10"/>
<text class="g" x="36" y="44" text-anchor="start">CHAMBER END</text>
<rect class="hvbox" x="50" y="70" width="290" height="50" rx="6"/>
<text class="t" x="195.0" y="92.0" text-anchor="middle">Chamber tube, +1 kV</text>
<text class="s" x="195.0" y="109.0" text-anchor="middle">photodiodes face into it</text>
<rect class="box" x="50" y="140" width="290" height="370" rx="6"/>
<text class="t" x="195.0" y="329.5" text-anchor="middle"></text>
<text class="t" x="195" y="162" text-anchor="middle">Detector board (≤ 20 mm), back side</text>
<rect class="box" x="62" y="250" width="50" height="30" rx="6"/>
<text class="t" x="87.0" y="269.5" text-anchor="middle">PD2</text>
<polyline class="wire" points="112,265 150,265"/>
<circle class="node" cx="131" cy="265" r="3"/>
<rect class="part" x="150" y="245" width="55" height="40" rx="3"/>
<text class="k" x="177" y="270" text-anchor="middle">SWF</text>
<text class="s" x="177" y="236" text-anchor="middle">switch connector</text>
<polyline class="wire" points="177,285 177,310"/>
<rect class="box" x="137" y="310" width="80" height="30" rx="6"/>
<text class="t" x="177.0" y="329.5" text-anchor="middle">CSA2</text>
<text class="s" x="224" y="330" text-anchor="start">idles at 0 V</text>
<polyline class="man" points="205,265 395,265"/>
<text class="lman" x="214" y="257" text-anchor="start">probe → SMA coax</text>
<rect class="box" x="62" y="365" width="268" height="45" rx="6"/>
<text class="t" x="196.0" y="384.5" text-anchor="middle">IN1, IN3, IN4</text>
<text class="s" x="196.0" y="401.5" text-anchor="middle">connector unmated: node stays on its CSA</text>
<rect class="box" x="62" y="430" width="268" height="60" rx="6"/>
<text class="t" x="196.0" y="457.0" text-anchor="middle">PicoBlade</text>
<text class="s" x="196.0" y="474.0" text-anchor="middle">PD bias, ring, TEST, ±4.5 V, GND</text>
<polyline class="man" points="420,460 332,460" marker-end="url(#aman)"/>
<text class="lman" x="376" y="452" text-anchor="middle">source</text>
<polyline class="wire" points="270,490 270,600"/>
<rect class="part" x="263" y="552" width="14" height="16" rx="2"/>
<text class="s" x="282" y="590" text-anchor="start">filtered pass-through: MCU board, PD bias</text>
<polyline class="hv" points="35,600 35,95 50,95"/>
<rect class="hvbox" x="27" y="552" width="16" height="16" rx="2"/>
<text class="lhv" x="48" y="585" text-anchor="start">HV feedthrough, lid interlock</text>
<rect class="hvbox" x="20" y="600" width="160" height="50" rx="6"/>
<text class="t" x="100.0" y="622.0" text-anchor="middle">External HV</text>
<text class="s" x="100.0" y="639.0" text-anchor="middle">≤ 1.1 kV, HV board</text>
<text class="g" x="590" y="44" text-anchor="start">ELECTROMETER HEAD (SHIELDED)</text>
<text class="s" x="590" y="62" text-anchor="start">feedback network at the summing node;</text>
<text class="s" x="590" y="77" text-anchor="start">values are examples, set in phase 2</text>
<rect class="box" x="395" y="245" width="75" height="40" rx="6"/>
<text class="t" x="432.5" y="269.5" text-anchor="middle"></text>
<text class="k" x="432" y="262" text-anchor="middle">input</text>
<text class="k" x="432" y="277" text-anchor="middle">protection</text>
<text class="s" x="470" y="310" text-anchor="middle">summing node: mm long,</text>
<text class="s" x="470" y="325" text-anchor="middle">PTFE or air, guarded</text>
<polyline class="wire" points="470,265 595,265"/>
<polyline class="wire" points="530,130 530,265"/>
<polyline class="wire" points="770,130 770,280"/>
<circle class="node" cx="530" cy="265" r="4"/>
<polyline class="wire" points="530,130 545,130"/>
<line class="lever-man" x1="549.5" y1="130" x2="575" y2="119"/>
