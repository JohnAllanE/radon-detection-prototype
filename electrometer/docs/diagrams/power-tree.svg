<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Electrometer power tree: a floating 1S2P Li-ion pack feeds a 3.3 V digital rail, low-noise plus and minus 5 V analog rails, and a plus and minus 60 V supply for the source that is switched on only when the source is used">
<title>Electrometer power tree: a floating 1S2P Li-ion pack feeds a 3.3 V digital rail, low-noise plus and minus 5 V analog rails, and a plus and minus 60 V supply for the source that is switched on only when the source is used</title>

<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --box:#ffffff; --edge:#898781;
        --group:#f3f2ee; --sig:#2a78d6; --ctl:#d95926; --man:#1a8f5a; --hv:#c62828; --pwr:#8e44ad; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --box:#262624; --edge:#6f6e69;
          --group:#222220; --sig:#3987e5; --ctl:#ec835a; --man:#52c48a; --hv:#ef6b6b; --pwr:#b783d6; }
  }
  .bg { fill:var(--bg); }
  .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
  .group { fill:var(--group); stroke:var(--edge); stroke-width:1; }
  .encl { fill:none; stroke:var(--edge); stroke-width:1.4; stroke-dasharray:7 4; }
  .hvbox { fill:var(--box); stroke:var(--hv); stroke-width:1.4; }
  .t { fill:var(--ink); font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { fill:var(--ink2); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .k { fill:var(--ink); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .g { fill:var(--ink2); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.02em; }
  .lsig { fill:var(--sig); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lctl { fill:var(--ctl); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lman { fill:var(--man); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lhv { fill:var(--hv); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wire { fill:none; stroke:var(--ink); stroke-width:1.3; }
  .sig { fill:none; stroke:var(--sig); stroke-width:2.2; stroke-linejoin:round; }
  .ctl { fill:none; stroke:var(--ctl); stroke-width:1.6; stroke-dasharray:6 4; stroke-linejoin:round; }
  .man { fill:none; stroke:var(--man); stroke-width:3; stroke-linejoin:round; }
  .gang { fill:none; stroke:var(--man); stroke-width:1.6; stroke-dasharray:3 3; stroke-linejoin:round; }
  .hv { fill:none; stroke:var(--hv); stroke-width:2.5; stroke-linejoin:round; }
  .pwr { fill:none; stroke:var(--pwr); stroke-width:3; stroke-linejoin:round; }
  .lpwr { fill:var(--pwr); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .hpwr { fill:var(--pwr); }
  .gnd { fill:none; stroke:var(--ink2); stroke-width:1.5; }
  .lever-man { stroke:var(--man); stroke-width:2.2; }
  .lever-ctl { stroke:var(--ctl); stroke-width:2.2; }
  .term { fill:var(--box); stroke:var(--ink); stroke-width:1.3; }
  .jack { fill:var(--box); stroke:var(--ink); stroke-width:1.5; }
  .part { fill:var(--box); stroke:var(--ink); stroke-width:1.3; }
  .plate { stroke:var(--ink); stroke-width:2.2; }
  .node { fill:var(--ink); }
  .cap0 { fill:var(--man); }
  .hsig { fill:var(--sig); } .hctl { fill:var(--ctl); } .hman { fill:var(--man); }
  .dot { fill:var(--ctl); stroke:var(--box); stroke-width:1.5; }
</style>
<defs>
  <marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hsig" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="actl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hctl" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aman" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hman" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="apwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hpwr" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1000" height="560" rx="10"/>
<g transform="translate(0,0)">
<rect class="box" x="30" y="60" width="170" height="60" rx="6"/>
<text class="t" x="115.0" y="87.0" text-anchor="middle">Li-ion 1S2P</text>
<text class="s" x="115.0" y="104.0" text-anchor="middle">2 × 18650, 3.0–4.2 V</text>
<rect class="box" x="240" y="60" width="170" height="60" rx="6"/>
<text class="t" x="325.0" y="87.0" text-anchor="middle">Switch, fuse</text>
<text class="s" x="325.0" y="104.0" text-anchor="middle">cell protection</text>
<polyline class="pwr" points="200,90 238,90" marker-end="url(#apwr)"/>
<polyline class="pwr" points="410,90 450,90"/>
<polyline class="pwr" points="450,55 450,255"/>
<rect class="box" x="480" y="30" width="210" height="50" rx="6"/>
<text class="t" x="585.0" y="52.0" text-anchor="middle">3.3 V buck-boost</text>
<text class="s" x="585.0" y="69.0" text-anchor="middle">digital rail</text>
<polyline class="pwr" points="450,55 478,55" marker-end="url(#apwr)"/>
<rect class="box" x="730" y="30" width="240" height="50" rx="6"/>
<text class="t" x="850.0" y="52.0" text-anchor="middle">Digital 3.3 V</text>
<text class="s" x="850.0" y="69.0" text-anchor="middle">ESP32-S3, ADC digital side, T/RH</text>
<polyline class="pwr" points="690,55 728,55" marker-end="url(#apwr)"/>
<rect class="box" x="480" y="120" width="210" height="50" rx="6"/>
<text class="t" x="585.0" y="142.0" text-anchor="middle">±6.5 V converters</text>
<text class="s" x="585.0" y="159.0" text-anchor="middle">≥ 1 MHz, shielded, far from the head</text>
<polyline class="pwr" points="450,145 478,145" marker-end="url(#apwr)"/>
<rect class="box" x="730" y="120" width="240" height="50" rx="6"/>
<text class="t" x="850.0" y="142.0" text-anchor="middle">±5 V low-noise LDOs</text>
<text class="s" x="850.0" y="159.0" text-anchor="middle">head (local RC filters), ADC, DACs</text>
<polyline class="pwr" points="690,145 728,145" marker-end="url(#apwr)"/>
<rect class="box" x="480" y="210" width="210" height="50" rx="6"/>
<text class="t" x="585.0" y="232.0" text-anchor="middle">±60 V boost</text>
<text class="s" x="585.0" y="249.0" text-anchor="middle">on only when the source is used</text>
<circle class="dot" cx="690" cy="210" r="5"/>
<polyline class="pwr" points="450,235 478,235" marker-end="url(#apwr)"/>
<rect class="box" x="730" y="210" width="240" height="50" rx="6"/>
<text class="t" x="850.0" y="232.0" text-anchor="middle">±50 V source amplifier</text>
<text class="s" x="850.0" y="249.0" text-anchor="middle">RC output filter, ≤ 100 µA</text>
<polyline class="pwr" points="690,235 728,235" marker-end="url(#apwr)"/>
<text class="s" x="30" y="160" text-anchor="start">Charger connects only with the</text>
<text class="s" x="30" y="176" text-anchor="start">main switch off (no charging</text>
<text class="s" x="30" y="192" text-anchor="start">while measuring, no ground loop)</text>
<rect class="group" x="30" y="300" width="940" height="230" rx="10"/>
<text class="g" x="48" y="326" text-anchor="start">GROUNDING</text>
<text class="k" x="48" y="356" text-anchor="start">• Analog common = op-amp + input = guard = coax shields = head shield = tin: one star point, in the head.</text>
<text class="k" x="48" y="384" text-anchor="start">• Digital ground joins the analog common once, at the ADC.</text>
<text class="k" x="48" y="412" text-anchor="start">• The instrument floats on its battery. Its only bond to the rest of the system is the probe shield</text>
<text class="k" x="60" y="430" text-anchor="start">at the detector board's 0 V (R-31).</text>
<text class="k" x="48" y="458" text-anchor="start">• The ±60 V boost and the radio are the two noise sources: keep them away from the head and shielded,</text>
<text class="k" x="60" y="476" text-anchor="start">turn the boost off when the source is not needed, and transmit between integration windows (R-23).</text>
</g>
</svg>
