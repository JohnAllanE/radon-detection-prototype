<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="Self-test by an injection capacitor, and the cal plug">
<title>Self-test by an injection capacitor, and the cal plug</title>

<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --box:#ffffff; --edge:#898781;
        --group:#f3f2ee; --sig:#2a78d6; --ctl:#d95926; --pwr:#8e44ad; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --box:#262624; --edge:#6f6e69;
          --group:#222220; --sig:#3987e5; --ctl:#ec835a; --pwr:#b783d6; }
  }
  .bg { fill:var(--bg); }
  .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
  .group { fill:var(--group); stroke:var(--edge); stroke-width:1; }
  .encl { fill:none; stroke:var(--edge); stroke-width:1.4; stroke-dasharray:7 4; }
  .off { fill:var(--box); stroke:var(--edge); stroke-width:1.2; stroke-dasharray:4 3; }
  .t { fill:var(--ink); font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { fill:var(--ink2); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .g { fill:var(--ink2); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.02em; }
  .lsig { fill:var(--sig); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lctl { fill:var(--ctl); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lpwr { fill:var(--pwr); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .sig { fill:none; stroke:var(--sig); stroke-width:2.2; stroke-linejoin:round; }
  .ctl { fill:none; stroke:var(--ctl); stroke-width:1.6; stroke-dasharray:6 4; stroke-linejoin:round; }
  .pwr { fill:none; stroke:var(--pwr); stroke-width:3; stroke-linejoin:round; }
  .flow { fill:none; stroke:var(--ink2); stroke-width:1.6; stroke-linejoin:round; }
  .hsig { fill:var(--sig); } .hctl { fill:var(--ctl); } .hpwr { fill:var(--pwr); } .hflow { fill:var(--ink2); }
  .dot { fill:var(--ctl); stroke:var(--box); stroke-width:1.5; }
</style>
<defs>
  <marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hsig" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="actl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hctl" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="apwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hpwr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hflow" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="680" height="300" rx="10"/>
<rect class="box" x="20" y="40" width="120" height="56" rx="6"/>
<text class="t" x="80.0" y="65.0" text-anchor="middle">Probe input</text>
<text class="s" x="80.0" y="82.0" text-anchor="middle">SWF probe</text>
<rect class="off" x="20" y="190" width="120" height="56" rx="6"/>
<text class="t" x="80.0" y="207.0" text-anchor="middle">Cal plug</text>
<text class="s" x="80.0" y="224.0" text-anchor="middle">known R to a</text>
<text class="s" x="80.0" y="239.0" text-anchor="middle">known voltage</text>
<polyline class="ctl" points="80,190 80,100" marker-end="url(#actl)"/>
<text class="lctl" x="88" y="150" text-anchor="start">fitted instead of a board, to</text>
<text class="lctl" x="88" y="166" text-anchor="start">check the resistor ranges</text>
<polyline class="flow" points="140,68 300,68 300,130 360,130"/>
<circle cx="300" cy="130" r="3.5" style="fill:var(--ink2)"/>
<text class="s" x="306" y="60" text-anchor="start">summing node (guarded)</text>
<polygon class="box" points="360,110 360,190 440,150"/>
<text class="t" x="366" y="134" text-anchor="start">−</text>
<text class="t" x="366" y="176" text-anchor="start">+</text>
<text class="s" x="370" y="208" text-anchor="start">ADA4530-1</text>
<polyline class="flow" points="360,170 340,170 340,190"/>
<line x1="328" y1="190" x2="352" y2="190" style="stroke:var(--ink2);stroke-width:1.6"/>
<line x1="332" y1="194" x2="348" y2="194" style="stroke:var(--ink2);stroke-width:1.6"/>
<line x1="336" y1="198" x2="344" y2="198" style="stroke:var(--ink2);stroke-width:1.6"/>
<polyline class="flow" points="440,150 520,150"/>
<text class="s" x="526" y="155" text-anchor="start">to ADC</text>
<polyline class="flow" points="300,68 300,30 480,30 480,150"/>
<rect class="box" x="392" y="18" width="68" height="24" rx="6"/>
<text class="t" x="426.0" y="34.5" text-anchor="middle">R or C<tspan dy="3.5" font-size="80%">f</tspan></text>
<rect class="box" x="160" y="200" width="120" height="56" rx="6"/>
<text class="t" x="220.0" y="225.0" text-anchor="middle">MCP4821 DAC</text>
<text class="s" x="220.0" y="242.0" text-anchor="middle">RC filtered</text>
<circle class="dot" cx="280" cy="200" r="5"/>
<polyline class="flow" points="280,228 300,228"/>
<polyline class="flow" points="300,228 300,175.0"/>
<polyline class="flow" points="300,183.0 300,130"/>
<line x1="288" y1="175.0" x2="312" y2="175.0" style="stroke:var(--ink);stroke-width:2.4"/>
<line x1="288" y1="183.0" x2="312" y2="183.0" style="stroke:var(--ink);stroke-width:2.4"/>
<text class="s" x="282" y="183.0" text-anchor="end">C<tspan dy="3.5" font-size="80%">inj</tspan><tspan dy="-3.5"> 1 pF</tspan></text>
<text class="s" x="160" y="282" text-anchor="start">Held at 0 V while measuring: no current. A ramp gives I = C dV/dt, a step a known charge.</text>
</svg>
