<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Per-channel signal chain, one per probe, four in the instrument: photodiode into a charge-sensitive preamp with a switched test charge and a filtered bias, over the connector to the MCU board, where a pole-zero and gain stage feeds a CR-RC^n shaper, a comparator that interrupts the ESP32-S3, and a peak detector with a reset switch and a hold buffer. The buffered hold goes straight to the ADS1220 and through a 4:1 mux to the ADS8689 or, as an option, the ESP32-S3&#x27;s own ADC.">
<title>Per-channel signal chain, one per probe, four in the instrument: photodiode into a charge-sensitive preamp with a switched test charge and a filtered bias, over the connector to the MCU board, where a pole-zero and gain stage feeds a CR-RC^n shaper, a comparator that interrupts the ESP32-S3, and a peak detector with a reset switch and a hold buffer. The buffered hold goes straight to the ADS1220 and through a 4:1 mux to the ADS8689 or, as an option, the ESP32-S3&#x27;s own ADC.</title>

<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --box:#ffffff; --edge:#898781;
        --group:#f3f2ee; --sig:#2a78d6; --ctl:#d95926; --pwr:#8e44ad; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --box:#262624; --edge:#6f6e69;
          --group:#222220; --sig:#3987e5; --ctl:#ec835a; --pwr:#b783d6; }
  }
  .bg { fill:var(--bg); }
  .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
  .group { fill:var(--group); stroke:var(--edge); stroke-width:1; }
  .encl { fill:none; stroke:var(--edge); stroke-width:1.4; stroke-dasharray:7 4; }
  .off { fill:var(--box); stroke:var(--edge); stroke-width:1.2; stroke-dasharray:4 3; }
  .t { fill:var(--ink); font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { fill:var(--ink2); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .g { fill:var(--ink2); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.02em; }
  .lsig { fill:var(--sig); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lctl { fill:var(--ctl); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lpwr { fill:var(--pwr); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .sig { fill:none; stroke:var(--sig); stroke-width:2.2; stroke-linejoin:round; }
  .ctl { fill:none; stroke:var(--ctl); stroke-width:1.6; stroke-dasharray:6 4; stroke-linejoin:round; }
  .pwr { fill:none; stroke:var(--pwr); stroke-width:3; stroke-linejoin:round; }
  .flow { fill:none; stroke:var(--ink2); stroke-width:1.6; stroke-linejoin:round; }
  .hsig { fill:var(--sig); } .hctl { fill:var(--ctl); } .hpwr { fill:var(--pwr); } .hflow { fill:var(--ink2); }
  .dot { fill:var(--ctl); stroke:var(--box); stroke-width:1.5; }
</style>
<defs>
  <marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hsig" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="actl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hctl" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="apwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hpwr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hflow" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1100" height="520" rx="10"/>
<rect class="group" x="20" y="20" width="300" height="300" rx="10"/>
<text class="g" x="36" y="42" text-anchor="start">PROBE (ATMOSPHERE SIDE EXCEPT PD)</text>
<rect class="box" x="40" y="140" width="90" height="45" rx="6"/>
<text class="t" x="85.0" y="159.5" text-anchor="middle">VTH2110</text>
<text class="s" x="85.0" y="176.5" text-anchor="middle">photodiode</text>
<rect class="box" x="170" y="135" width="130" height="55" rx="6"/>
<text class="t" x="235.0" y="159.5" text-anchor="middle">CSA</text>
<text class="s" x="235.0" y="176.5" text-anchor="middle">C<tspan dy="3.5" font-size="80%">f</tspan><tspan dy="-3.5">, R</tspan><tspan dy="3.5" font-size="80%">f</tspan><tspan dy="-3.5">, op-amp</tspan></text>
<polyline class="sig" points="130,162 168,162" marker-end="url(#asig)"/>
<rect class="box" x="170" y="230" width="130" height="45" rx="6"/>
<text class="t" x="235.0" y="249.5" text-anchor="middle">Output</text>
<text class="s" x="235.0" y="266.5" text-anchor="middle">series R</text>
<polyline class="sig" points="235,190 235,228" marker-end="url(#asig)"/>
<rect class="box" x="40" y="60" width="120" height="50" rx="6"/>
<text class="t" x="100.0" y="82.0" text-anchor="middle">PD bias filter</text>
<text class="s" x="100.0" y="99.0" text-anchor="middle">from the HV board</text>
<polyline class="pwr" points="100,110 100,138" marker-end="url(#apwr)"/>
<rect class="box" x="180" y="60" width="120" height="50" rx="6"/>
<text class="t" x="240.0" y="82.0" text-anchor="middle">Test pulse</text>
<text class="s" x="240.0" y="99.0" text-anchor="middle">switch, C<tspan dy="3.5" font-size="80%">test</tspan></text>
<polyline class="sig" points="240,110 240,133" marker-end="url(#asig)"/>
<rect class="group" x="360" y="20" width="720" height="460" rx="10"/>
<text class="g" x="376" y="42" text-anchor="start">MCU BOARD (SINGLE +5 V, TLV90XX)</text>
<polyline class="sig" points="300,252 380,252" marker-end="url(#asig)"/>
<text class="lsig" x="330" y="244" text-anchor="middle">PicoBlade</text>
<rect class="box" x="382" y="330" width="120" height="55" rx="6"/>
<text class="t" x="442.0" y="354.5" text-anchor="middle">Monitor buffer</text>
<text class="s" x="442.0" y="371.5" text-anchor="middle">to rear SMA</text>
<polyline class="sig" points="345,252 345,357 380,357" marker-end="url(#asig)"/>
<rect class="box" x="382" y="225" width="120" height="55" rx="6"/>
<text class="t" x="442.0" y="249.5" text-anchor="middle">Pole-zero</text>
<text class="s" x="442.0" y="266.5" text-anchor="middle">and gain stage</text>
<rect class="box" x="540" y="225" width="120" height="55" rx="6"/>
<text class="t" x="600.0" y="241.5" text-anchor="middle">Shaper</text>
<text class="s" x="600.0" y="258.5" text-anchor="middle">CR-RC<tspan dy="-5" font-size="80%">n</tspan></text>
<text class="s" x="600.0" y="273.5" text-anchor="middle">τ 2 to 10 µs</text>
<polyline class="sig" points="502,252 538,252" marker-end="url(#asig)"/>
<rect class="box" x="700" y="90" width="140" height="50" rx="6"/>
<text class="t" x="770.0" y="112.0" text-anchor="middle">Comparator</text>
<text class="s" x="770.0" y="129.0" text-anchor="middle">TLV9061 or TLV3201</text>
<polyline class="sig" points="660,240 680,240 680,115 698,115" marker-end="url(#asig)"/>
<rect class="box" x="700" y="225" width="140" height="55" rx="6"/>
<text class="t" x="770.0" y="249.5" text-anchor="middle">Peak detector</text>
<text class="s" x="770.0" y="266.5" text-anchor="middle">op-amp, diode, C<tspan dy="3.5" font-size="80%">hold</tspan></text>
<polyline class="sig" points="660,252 698,252" marker-end="url(#asig)"/>
<rect class="box" x="700" y="330" width="140" height="45" rx="6"/>
<text class="t" x="770.0" y="349.5" text-anchor="middle">Reset switch</text>
<text class="s" x="770.0" y="366.5" text-anchor="middle">TMUX1101</text>
<circle class="dot" cx="840" cy="330" r="5"/>
<polyline class="ctl" points="770,330 770,282" marker-end="url(#actl)"/>
<rect class="box" x="870" y="225" width="90" height="55" rx="6"/>
<text class="t" x="915.0" y="249.5" text-anchor="middle">Hold</text>
<text class="s" x="915.0" y="266.5" text-anchor="middle">buffer</text>
<polyline class="sig" points="840,252 868,252" marker-end="url(#asig)"/>
<rect class="box" x="980" y="120" width="85" height="55" rx="6"/>
<text class="t" x="1022.5" y="144.5" text-anchor="middle">ADS1220</text>
<text class="s" x="1022.5" y="161.5" text-anchor="middle">AIN0–3, SE</text>
<polyline class="sig" points="960,240 970,240 970,147 978,147" marker-end="url(#asig)"/>
<rect class="box" x="870" y="330" width="90" height="45" rx="6"/>
<text class="t" x="915.0" y="349.5" text-anchor="middle">TMUX1104</text>
<text class="s" x="915.0" y="366.5" text-anchor="middle">4:1 mux</text>
<circle class="dot" cx="960" cy="330" r="5"/>
<polyline class="sig" points="915,280 915,328" marker-end="url(#asig)"/>
<rect class="box" x="980" y="300" width="85" height="45" rx="6"/>
<text class="t" x="1022.5" y="327.0" text-anchor="middle">ADS8689</text>
<polyline class="sig" points="960,345 970,345 970,322 978,322" marker-end="url(#asig)"/>
<rect class="box" x="980" y="400" width="85" height="50" rx="6"/>
<text class="t" x="1022.5" y="422.0" text-anchor="middle">ESP32-S3</text>
<text class="s" x="1022.5" y="439.0" text-anchor="middle">ADC, option</text>
<polyline class="sig" points="960,360 972,360 972,425 978,425" marker-end="url(#asig)"/>
<rect class="box" x="382" y="60" width="120" height="55" rx="6"/>
<text class="t" x="442.0" y="84.5" text-anchor="middle">ESP32-S3</text>
<text class="s" x="442.0" y="101.5" text-anchor="middle">MCU</text>
<polyline class="ctl" points="770,90 770,75 504,75" marker-end="url(#actl)"/>
<text class="lctl" x="637" y="68" text-anchor="middle">interrupt, channel ID</text>
<polyline class="ctl" points="382,100 372,100 372,465 915,465 915,377" marker-end="url(#actl)"/>
<polyline class="ctl" points="770,465 770,377" marker-end="url(#actl)"/>
<text class="lctl" x="640" y="457" text-anchor="middle">mux select, reset</text>
<polyline class="sig" points="30,505 80,505" marker-end="url(#asig)"/>
<text class="s" x="90" y="509" text-anchor="start">Analog signal</text>
<polyline class="ctl" points="194.5,505 244.5,505" marker-end="url(#actl)"/>
<text class="s" x="254.5" y="509" text-anchor="start">Logic, radio or LAN</text>
<polyline class="pwr" points="398.0,505 448.0,505" marker-end="url(#apwr)"/>
<text class="s" x="458.0" y="509" text-anchor="start">Power</text>
<circle class="dot" cx="535.5" cy="505" r="5"/>
<text class="s" x="570.5" y="509" text-anchor="start">Set by the controller (logic header)</text>
</svg>
