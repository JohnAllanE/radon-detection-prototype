<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="System block diagram: four probes, two on the radon tube and two on the vacuum chamber, each carry one photodiode, one charge-sensitive preamp and a test-pulse switch, and connect to one four-channel MCU board, which shapes, holds, digitises, reports to the host and buffers each preamp output to a rear SMA for a scope. The HV board makes about +1 kV for the Part 1 chamber walls and the regulated photodiode bias.">
<title>System block diagram: four probes, two on the radon tube and two on the vacuum chamber, each carry one photodiode, one charge-sensitive preamp and a test-pulse switch, and connect to one four-channel MCU board, which shapes, holds, digitises, reports to the host and buffers each preamp output to a rear SMA for a scope. The HV board makes about +1 kV for the Part 1 chamber walls and the regulated photodiode bias.</title>

<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --box:#ffffff; --edge:#898781;
        --group:#f3f2ee; --sig:#2a78d6; --ctl:#d95926; --pwr:#8e44ad; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --box:#262624; --edge:#6f6e69;
          --group:#222220; --sig:#3987e5; --ctl:#ec835a; --pwr:#b783d6; }
  }
  .bg { fill:var(--bg); }
  .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
  .group { fill:var(--group); stroke:var(--edge); stroke-width:1; }
  .encl { fill:none; stroke:var(--edge); stroke-width:1.4; stroke-dasharray:7 4; }
  .off { fill:var(--box); stroke:var(--edge); stroke-width:1.2; stroke-dasharray:4 3; }
  .t { fill:var(--ink); font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { fill:var(--ink2); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .g { fill:var(--ink2); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.02em; }
  .lsig { fill:var(--sig); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lctl { fill:var(--ctl); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lpwr { fill:var(--pwr); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .sig { fill:none; stroke:var(--sig); stroke-width:2.2; stroke-linejoin:round; }
  .ctl { fill:none; stroke:var(--ctl); stroke-width:1.6; stroke-dasharray:6 4; stroke-linejoin:round; }
  .pwr { fill:none; stroke:var(--pwr); stroke-width:3; stroke-linejoin:round; }
  .flow { fill:none; stroke:var(--ink2); stroke-width:1.6; stroke-linejoin:round; }
  .hsig { fill:var(--sig); } .hctl { fill:var(--ctl); } .hpwr { fill:var(--pwr); } .hflow { fill:var(--ink2); }
  .dot { fill:var(--ctl); stroke:var(--box); stroke-width:1.5; }
</style>
<defs>
  <marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hsig" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="actl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hctl" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="apwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hpwr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hflow" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1000" height="470" rx="10"/>
<rect class="encl" x="20" y="20" width="330" height="300" rx="12"/>
<text class="g" x="36" y="42" text-anchor="start">CHAMBER (THE PROBE IS THE SEAL)</text>
<rect class="box" x="40" y="60" width="290" height="60" rx="6"/>
<text class="t" x="185.0" y="87.0" text-anchor="middle">Silicon photodiode</text>
<text class="s" x="185.0" y="104.0" text-anchor="middle">chamber side, on the axis</text>
<rect class="box" x="40" y="150" width="290" height="70" rx="6"/>
<text class="t" x="185.0" y="174.0" text-anchor="middle">Charge-sensitive preamp</text>
<text class="s" x="185.0" y="191.0" text-anchor="middle">atmosphere side, test-pulse switch</text>
<text class="s" x="185.0" y="206.0" text-anchor="middle">probe type P-A, P-L, P-T or P-J</text>
<polyline class="sig" points="185,120 185,148" marker-end="url(#asig)"/>
<rect class="box" x="40" y="245" width="290" height="55" rx="6"/>
<text class="t" x="185.0" y="269.5" text-anchor="middle">Second probe</text>
<text class="s" x="185.0" y="286.5" text-anchor="middle">another type; 2 chambers, 4 probes</text>
<rect class="box" x="430" y="120" width="280" height="150" rx="6"/>
<text class="t" x="570.0" y="168.0" text-anchor="middle">MCU board</text>
<text class="s" x="570.0" y="185.0" text-anchor="middle">4 channels: shaping, peak hold</text>
<text class="s" x="570.0" y="200.0" text-anchor="middle">comparator trigger, channel mux</text>
<text class="s" x="570.0" y="215.0" text-anchor="middle">ADCs, ESP32-S3 microcontroller</text>
<text class="s" x="570.0" y="230.0" text-anchor="middle">test-pulse trigger and level</text>
<polyline class="sig" points="330,185 428,185" marker-end="url(#asig)"/>
<polyline class="sig" points="330,272 380,272 380,200 428,200" marker-end="url(#asig)"/>
<text class="lsig" x="379" y="176" text-anchor="middle">board-to-board</text>
<text class="lsig" x="379" y="290" text-anchor="middle">wire connector</text>
<rect class="box" x="790" y="145" width="180" height="60" rx="6"/>
<text class="t" x="880.0" y="172.0" text-anchor="middle">Host</text>
<text class="s" x="880.0" y="189.0" text-anchor="middle">PC</text>
<polyline class="ctl" points="710,175 788,175" marker-end="url(#actl)"/>
<text class="lctl" x="750" y="166" text-anchor="middle">USB</text>
<text class="lctl" x="750" y="194" text-anchor="middle">ESP-NOW option</text>
<rect class="box" x="430" y="345" width="280" height="95" rx="6"/>
<text class="t" x="570.0" y="373.5" text-anchor="middle">HV board</text>
<text class="s" x="570.0" y="390.5" text-anchor="middle">48 V in, PCB transformer to 100–200 V</text>
<text class="s" x="570.0" y="405.5" text-anchor="middle">Walton multiplier, fixed output</text>
<text class="s" x="570.0" y="420.5" text-anchor="middle">regulated PD bias</text>
<polyline class="pwr" points="430,395 205,395 205,322" marker-end="url(#apwr)"/>
<text class="lpwr" x="318" y="386" text-anchor="middle">about +1 kV to the Part 1 walls</text>
<polyline class="pwr" points="430,420 12,420 12,90 38,90" marker-end="url(#apwr)"/>
<text class="lpwr" x="120" y="412" text-anchor="middle">regulated PD bias</text>
<rect class="box" x="790" y="40" width="180" height="60" rx="6"/>
<text class="t" x="880.0" y="67.0" text-anchor="middle">Scope, optional</text>
<text class="s" x="880.0" y="84.0" text-anchor="middle">4 × rear SMA</text>
<polyline class="sig" points="640,120 640,70 788,70" marker-end="url(#asig)"/>
<text class="lsig" x="714" y="62" text-anchor="middle">buffered CSA outputs</text>
<rect class="box" x="790" y="345" width="180" height="40" rx="6"/>
<text class="t" x="880.0" y="369.5" text-anchor="middle">48 V wall adapter</text>
<polyline class="pwr" points="790,365 712,365" marker-end="url(#apwr)"/>
<rect class="box" x="790" y="250" width="180" height="40" rx="6"/>
<text class="t" x="880.0" y="274.5" text-anchor="middle">5 V wall adapter</text>
<polyline class="pwr" points="790,270 712,270" marker-end="url(#apwr)"/>
<polyline class="pwr" points="430,160 332,160" marker-end="url(#apwr)"/>
<text class="lpwr" x="379" y="152" text-anchor="middle">±4.5 V</text>
<polyline class="sig" points="30,458 80,458" marker-end="url(#asig)"/>
<text class="s" x="90" y="462" text-anchor="start">Analog signal</text>
<polyline class="ctl" points="194.5,458 244.5,458" marker-end="url(#actl)"/>
<text class="s" x="254.5" y="462" text-anchor="start">Logic, radio or LAN</text>
<polyline class="pwr" points="398.0,458 448.0,458" marker-end="url(#apwr)"/>
<text class="s" x="458.0" y="462" text-anchor="start">Power</text>
</svg>
