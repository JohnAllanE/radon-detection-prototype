<rect class="gd" x="75.75" y="247" width="2.2" height="3"/>
<rect class="cu" x="78.5" y="246" width="144.375" height="4"/>
<rect class="tube" x="232.77499999999998" y="40" width="105.10500000000002" height="177.0"/>
<path class="thr" d="M265.88,60 l6,9 l-6,9"/>
<path class="thr" d="M265.88,78 l6,9 l-6,9"/>
<path class="thr" d="M265.88,96 l6,9 l-6,9"/>
<path class="thr" d="M265.88,114 l6,9 l-6,9"/>
<path class="thr" d="M265.88,132 l6,9 l-6,9"/>
<path class="thr" d="M265.88,150 l6,9 l-6,9"/>
<path class="thr" d="M265.88,168 l6,9 l-6,9"/>
<path class="thr" d="M265.88,186 l6,9 l-6,9"/>
<path class="thr" d="M265.88,204 l6,9 l-6,9"/>
<rect class="ptfe" x="234.97499999999997" y="217.0" width="91.90500000000003" height="33.0"/>
<polyline class="flow" points="40.0,30 40.0,277.6"/>
<text class="s" x="44.0" y="26" text-anchor="start">axis</text>
<polyline class="flow" points="271.88,140 361.88,140"/>
<text class="s" x="367.88" y="144" text-anchor="start">NPT thread, inside the flange: at +1 kV on both sides, no field</text>
<polyline class="flow" points="265.775,70 361.88,70"/>
<text class="s" x="367.88" y="74" text-anchor="start">Pipe wall and flange, +1 kV</text>
<polyline class="flow" points="304.88,233.5 361.88,233.5"/>
<text class="s" x="367.88" y="237.5" text-anchor="start">PTFE washer, 1 mm (VERIFY): covers the thread seam</text>
<text class="lctl" x="367.88" y="180" text-anchor="start">Top copper at V_top (orange), die at 0 V (blue):</text>
<text class="s" x="367.88" y="200" text-anchor="start">200 V: 56 % of the gas volume to the active area</text>
<text class="s" x="367.88" y="218" text-anchor="start">600 V: 76 %, but 1.7 kV/mm at the copper's inner edge</text>
<text class="s" x="44.0" y="289.6" text-anchor="start">VTH2110 at 0 V (CSA input), proposed 0 V guard trace beside it</text>
<text class="s" x="44.0" y="26" text-anchor="start">axis</text>
<text class="s" x="40.0" y="360" text-anchor="start">Radius to scale (11 px/mm), heights exaggerated three times. Numbers: S-02, h = 0.1 mm.</text>
</svg>
