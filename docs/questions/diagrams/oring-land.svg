<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="Tube end on the detector board">
<title>Tube end on the detector board</title>

<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --box:#ffffff; --edge:#898781;
        --group:#f3f2ee; --sig:#2a78d6; --ctl:#d95926; --pwr:#8e44ad; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --box:#262624; --edge:#6f6e69;
          --group:#222220; --sig:#3987e5; --ctl:#ec835a; --pwr:#b783d6; }
  }
  .bg { fill:var(--bg); }
  .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
  .group { fill:var(--group); stroke:var(--edge); stroke-width:1; }
  .encl { fill:none; stroke:var(--edge); stroke-width:1.4; stroke-dasharray:7 4; }
  .off { fill:var(--box); stroke:var(--edge); stroke-width:1.2; stroke-dasharray:4 3; }
  .t { fill:var(--ink); font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { fill:var(--ink2); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .g { fill:var(--ink2); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.02em; }
  .lsig { fill:var(--sig); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lctl { fill:var(--ctl); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lpwr { fill:var(--pwr); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .sig { fill:none; stroke:var(--sig); stroke-width:2.2; stroke-linejoin:round; }
  .ctl { fill:none; stroke:var(--ctl); stroke-width:1.6; stroke-dasharray:6 4; stroke-linejoin:round; }
  .pwr { fill:none; stroke:var(--pwr); stroke-width:3; stroke-linejoin:round; }
  .flow { fill:none; stroke:var(--ink2); stroke-width:1.6; stroke-linejoin:round; }
  .hsig { fill:var(--sig); } .hctl { fill:var(--ctl); } .hpwr { fill:var(--pwr); } .hflow { fill:var(--ink2); }
  .dot { fill:var(--ctl); stroke:var(--box); stroke-width:1.5; }
</style>
<defs>
  <marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hsig" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="actl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hctl" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="apwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hpwr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hflow" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
  .die { fill:var(--group); stroke:var(--edge); stroke-width:1.2; }
  .act { fill:var(--sig); fill-opacity:.18; stroke:var(--sig); stroke-width:1; }
  .dead { fill:var(--ctl); fill-opacity:.28; stroke:none; }
  .ring50 { fill:none; stroke:var(--ctl); stroke-width:1.8; stroke-dasharray:5 3; }
  .tube { fill:var(--pwr); fill-opacity:.18; stroke:var(--pwr); stroke-width:1.4; }
  .bar { fill:var(--sig); fill-opacity:.75; }
  .barx { fill:var(--sig); fill-opacity:.3; }
  .hl { fill:none; stroke:var(--ctl); stroke-width:2.2; }
</style>

<rect class="bg" x="0" y="0" width="680" height="330" rx="10"/>
<rect class="die" x="30.0" y="230.0" width="306.0" height="57.6"/>
<text class="s" x="37.2" y="262.4" text-anchor="start">FR4 board, 1.6 mm, back copper 0 V</text>
<rect class="act" x="30.0" y="219.2" width="85.31999999999996" height="10.799999999999999"/>
<rect x="126.12" y="226.0" width="33.480000000000004" height="6" style="fill:var(--pwr)"/>
<path class="tube" d="M192.0,42.79999999999998 L192.0,176.0 Q192.0,194.0 210.0,194.0 L276.06000000000006,194.0 Q294.06000000000006,194.0 294.06000000000006,176.0 L294.06000000000006,42.79999999999998 Z"/>
<circle cx="242.4" cy="212.0" r="18.0" style="fill:var(--ink2)"/>
<text class="lsig" x="37.2" y="64.4" text-anchor="start">dies to 8.37 mm (diagonal)</text>
<polyline class="sig" points="44.40000000000001,73.4 44.40000000000001,217.4" marker-end="url(#asig)"/>
<text class="lpwr" x="51.59999999999999" y="100.4" text-anchor="start">ring on +20 V, 8.67–9.6 mm</text>
<polyline class="pwr" points="123.6,107.60000000000001 141.6,224.6" marker-end="url(#apwr)"/>
<text class="s" x="195.6" y="32.0" text-anchor="start">tube, +1 kV</text>
<text class="lctl" x="303.59999999999997" y="78.79999999999998" text-anchor="start">edges broken</text>
<text class="lctl" x="303.59999999999997" y="95.0" text-anchor="start">to 0.5 mm radius</text>
<polyline class="ctl" points="301.8,100.4 291.0,185.0" marker-end="url(#actl)"/>
<text class="s" x="303.59999999999997" y="150.8" text-anchor="start">O-ring on bare</text>
<text class="s" x="303.59999999999997" y="167.0" text-anchor="start">laminate, 1–2 mm</text>
<text class="s" x="303.59999999999997" y="183.2" text-anchor="start">compressed (VERIFY)</text>
<text class="s" x="37.2" y="319.8" text-anchor="start">To scale, 36 px per mm. The 2.1 mm die-to-wall gap and 0.9 mm ring-to-wall gap are S-01's.</text>
</svg>
