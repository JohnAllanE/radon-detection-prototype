<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" role="img" aria-label="HV output with the series resistor and the readback divider">
<title>HV output with the series resistor and the readback divider</title>

<style>
  svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --box:#ffffff; --edge:#898781;
        --group:#f3f2ee; --sig:#2a78d6; --ctl:#d95926; --pwr:#8e44ad; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --box:#262624; --edge:#6f6e69;
          --group:#222220; --sig:#3987e5; --ctl:#ec835a; --pwr:#b783d6; }
  }
  .bg { fill:var(--bg); }
  .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
  .group { fill:var(--group); stroke:var(--edge); stroke-width:1; }
  .encl { fill:none; stroke:var(--edge); stroke-width:1.4; stroke-dasharray:7 4; }
  .off { fill:var(--box); stroke:var(--edge); stroke-width:1.2; stroke-dasharray:4 3; }
  .t { fill:var(--ink); font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { fill:var(--ink2); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .g { fill:var(--ink2); font:600 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.02em; }
  .lsig { fill:var(--sig); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lctl { fill:var(--ctl); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lpwr { fill:var(--pwr); font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; }
  .sig { fill:none; stroke:var(--sig); stroke-width:2.2; stroke-linejoin:round; }
  .ctl { fill:none; stroke:var(--ctl); stroke-width:1.6; stroke-dasharray:6 4; stroke-linejoin:round; }
  .pwr { fill:none; stroke:var(--pwr); stroke-width:3; stroke-linejoin:round; }
  .flow { fill:none; stroke:var(--ink2); stroke-width:1.6; stroke-linejoin:round; }
  .hsig { fill:var(--sig); } .hctl { fill:var(--ctl); } .hpwr { fill:var(--pwr); } .hflow { fill:var(--ink2); }
  .dot { fill:var(--ctl); stroke:var(--box); stroke-width:1.5; }
</style>
<defs>
  <marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hsig" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="actl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hctl" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="apwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hpwr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="aflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="hflow" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
  .die { fill:var(--group); stroke:var(--edge); stroke-width:1.2; }
  .act { fill:var(--sig); fill-opacity:.18; stroke:var(--sig); stroke-width:1; }
  .dead { fill:var(--ctl); fill-opacity:.28; stroke:none; }
  .ring50 { fill:none; stroke:var(--ctl); stroke-width:1.8; stroke-dasharray:5 3; }
  .tube { fill:var(--pwr); fill-opacity:.18; stroke:var(--pwr); stroke-width:1.4; }
  .bar { fill:var(--sig); fill-opacity:.75; }
  .barx { fill:var(--sig); fill-opacity:.3; }
  .hl { fill:none; stroke:var(--ctl); stroke-width:2.2; }
</style>

<rect class="bg" x="0" y="0" width="700" height="270" rx="10"/>
<rect class="box" x="20" y="70" width="130" height="70" rx="6"/>
<text class="t" x="85.0" y="94.0" text-anchor="middle">HV board</text>
<text class="s" x="85.0" y="111.0" text-anchor="middle">48 V in, about +1 kV</text>
<text class="s" x="85.0" y="126.0" text-anchor="middle">PWM, multiplier</text>
<polyline class="flow" points="150,105 230,105"/>
<circle cx="230" cy="105" r="3.5" style="fill:var(--ink2)"/>
<rect class="box" x="222" y="125" width="16" height="44" rx="2"/>
<text class="s" x="246" y="152" text-anchor="start">100 MΩ</text>
<polyline class="flow" points="230,105 230,125"/>
<polyline class="flow" points="230,169 230,185"/>
<circle cx="230" cy="185" r="3.5" style="fill:var(--ink2)"/>
<rect class="box" x="222" y="195" width="16" height="30" rx="2"/>
<text class="s" x="246" y="214" text-anchor="start">100 kΩ</text>
<polyline class="flow" points="230,185 230,195"/>
<polyline class="flow" points="230,225 230,236"/>
<line x1="218" y1="236" x2="242" y2="236" style="stroke:var(--ink2);stroke-width:1.6"/>
<line x1="222" y1="240" x2="238" y2="240" style="stroke:var(--ink2);stroke-width:1.6"/>
<line x1="226" y1="244" x2="234" y2="244" style="stroke:var(--ink2);stroke-width:1.6"/>
<polyline class="sig" points="230,185 150,185 150,150" marker-end="url(#asig)"/>
<text class="lsig" x="30" y="202" text-anchor="start">1 V per kV: feedback,</text>
<text class="lsig" x="30" y="218" text-anchor="start">MCU ADC, test point</text>
<rect class="box" x="300" y="97" width="70" height="16" rx="2"/>
<text class="s" x="335.0" y="91" text-anchor="middle">R<tspan dy="3.5" font-size="80%">S</tspan><tspan dy="-3.5"> ≥ 10 MΩ (A-21)</tspan></text>
<polyline class="flow" points="230,105 300,105"/>
<polyline class="flow" points="370,105 450,105"/>
<rect class="tube" x="450" y="70" width="150" height="70" rx="6"/>
<text class="t" x="525" y="100" text-anchor="middle">Chamber tube</text>
<text class="s" x="525" y="118" text-anchor="middle">pA ion current</text>
<polyline class="flow" points="490,140 490,166.0"/>
<polyline class="flow" points="490,174.0 490,200"/>
<line x1="478" y1="166.0" x2="502" y2="166.0" style="stroke:var(--ink);stroke-width:2.4"/>
<line x1="478" y1="174.0" x2="502" y2="174.0" style="stroke:var(--ink);stroke-width:2.4"/>
<text class="s" x="472" y="174.0" text-anchor="end">C<tspan dy="3.5" font-size="80%">tube</tspan><tspan dy="-3.5"> (VERIFY)</tspan></text>
<line x1="478" y1="200" x2="502" y2="200" style="stroke:var(--ink2);stroke-width:1.6"/>
<line x1="482" y1="204" x2="498" y2="204" style="stroke:var(--ink2);stroke-width:1.6"/>
<line x1="486" y1="208" x2="494" y2="208" style="stroke:var(--ink2);stroke-width:1.6"/>
<polyline class="ctl" points="580,140 620,200" marker-end="url(#actl)"/>
<text class="lctl" x="560" y="222" text-anchor="start">flashover to a diode</text>
<text class="lctl" x="560" y="238" text-anchor="start">or probe: ≤ 100 µA</text>
</svg>
